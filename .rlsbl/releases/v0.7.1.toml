# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Fix Windows build break so releases publish for all platforms; correct config-conflict docs."
# Optional context explaining why these changes were made
context = """
v0.6.2 and v0.7.0 Publish workflows failed because goreleaser builds Windows
but readParentCmdline was defined only under linux/darwin build tags, leaving
it undefined on windows. Added a non-linux/darwin stub returning an honest
empty (unavailable) value. Also corrected the config-conflict documentation to
note that the CLI/config divergence check only fires for pre-command global
flag placement, not post-command.
"""
